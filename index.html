<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bản đồ số Di tích & Di sản Sơn La</title>
  
  <!-- Thư viện Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
    .top-header { background: #1b5e20; color: #fff; padding: 10px 15px; font-weight: bold; font-size: 14px; }
    #map { width: 100%; height: 92vh; }
    
    /* Giao diện khung tên hiển thị ngay dưới ghim */
    .marker-card {
      background: #ffffff;
      border: 2px solid #1b5e20;
      padding: 3px 6px;
      border-radius: 6px;
      text-align: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      white-space: nowrap;
    }
    .marker-title {
      font-weight: bold;
      font-size: 11px;
      color: #1b5e20;
      display: block;
    }

    .popup-img { width: 100%; height: 110px; object-fit: cover; border-radius: 4px; margin-bottom: 5px; }
    .btn { display: block; width: 100%; text-align: center; padding: 6px 0; border-radius: 4px; text-decoration: none; font-weight: bold; margin-top: 5px; font-size: 12px; color: #fff; }
  </style>
</head>
<body>

  <div class="top-header">Di sản & Di tích Lịch sử Sơn La (STEM)</div>
  <div id="map"></div>

  <!-- Thư viện Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Khởi tạo bản đồ
    var map = L.map('map').setView([21.3283, 103.9149], 9);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: 'Bản đồ số Sơn La'
    }).addTo(map);

    // Định vị GPS người dùng
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        var userLat = position.coords.latitude;
        var userLng = position.coords.longitude;
        var userIcon = L.divIcon({
          className: 'user-gps-icon',
          html: '<div style="background-color: #2980b9; width: 16px; height: 16px; border: 3px solid white; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.6);"></div>',
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });
        var userMarker = L.marker([userLat, userLng], { icon: userIcon }).addTo(map);
        userMarker.bindPopup("<b>📍 Vị trí hiện tại của bạn</b>");
      });
    }

    // Danh sách 10 địa danh khớp chuẩn 100% với tên
