<!DOCTYPE html>
<html lang="vi">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta charset="UTF-8">
  <title>Trải nghiệm Di sản Sơn La WebAR</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #top-bar { position: absolute; top: 15px; left: 15px; right: 15px; z-index: 1000; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .btn-back { pointer-events: auto; background: rgba(0,0,0,0.65); color: #fff; padding: 8px 14px; border-radius: 20px; text-decoration: none; font-size: 13px; }
    #guide-box { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); background: rgba(17,17,17,0.85); color: #fff; padding: 10px 20px; border-radius: 25px; font-size: 13px; text-align: center; z-index: 1000; }
  </style>
  <script>
    AFRAME.registerComponent('drag-rotate', {
      init: function () {
        let isDragging = false; let previousX = 0;
        window.addEventListener('touchstart', (e) => { if (e.touches.length === 1) { isDragging = true; previousX = e.touches[0].clientX; } });
        window.addEventListener('touchmove', (e) => {
          if (!isDragging || e.touches.length !== 1) return;
          const deltaX = e.touches[0].clientX - previousX; previousX = e.touches[0].clientX;
          const currentRotation = this.el.getAttribute('rotation');
          this.el.setAttribute('rotation', { x: currentRotation.x, y: currentRotation.y + deltaX * 0.5, z: currentRotation.z });
        });
        window.addEventListener('touchend', () => { isDragging = false; });
      }
    });
  </script>
</head>
<body>
  <div id="top-bar">
    <a href="index.html" class="btn-back">⬅ Quay lại bản đồ</a>
  </div>
  <div id="guide-box">Hướng camera vào thẻ ảnh di tích trên bàn</div>
  
  <!-- ĐÃ GIỮ NGUYÊN BỘ NHẬN DIỆN MẪU, NHƯNG THAY ĐỔI MÔ HÌNH 3D -->
  <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/image-tracking/assets/card-example/targets.mind; autoStart: true; uiScanning: yes;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- ĐÂY LÀ LINK ĐÃ ĐƯỢC ĐỔI SANG CHIẾC MŨ SẮT -->
      <a-asset-item id="model-nhasan" src="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models/2.0/DamagedHelmet/glTF-Binary/DamagedHelmet.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Đã phóng to scale lên 0.3 để dễ nhìn hơn -->
      <a-gltf-model src="#model-nhasan" position="0 0 0.1" scale="0.3 0.3 0.3" rotation="90 0 0" drag-rotate animation="property: rotation; to: 90 360 0; loop: true; dur: 10000; easing: linear"></a-gltf-model>
    </a-entity>
  </a-scene>
</body>
</html>
