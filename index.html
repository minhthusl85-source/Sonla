<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bản đồ số Di tích & Di sản Sơn La</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* Chuẩn hóa phông chữ Times New Roman, cỡ 14pt toàn trang */
    body, .leaflet-container { 
      margin: 0; 
      padding: 0; 
      font-family: "Times New Roman", Times, serif !important; 
      font-size: 14pt !important; 
    }
    
    /* Căn lề hai bên, khoảng cách đoạn 6pt, không khoảng trống tự do */
    p { 
      text-align: justify !important; 
      margin: 0 0 6pt 0 !important; 
      padding: 0 !important; 
      line-height: normal;
    }
    /* Các tiêu đề in đậm, khoảng cách 6pt */
    h1, h2, h3, .marker-title, .top-header, b { 
      font-weight: bold !important; 
      margin: 0 0 6pt 0 !important; 
    }

    .top-header { 
      background: #1b5e20; 
      color: #fff; 
      padding: 10pt; 
      text-align: center; 
    }
    #map { width: 100%; height: 92vh; }
    
    /* Khung hiển thị Ảnh và Tên trực tiếp ngay trên bản đồ */
    .map-badge {
      background: #ffffff;
      border: 2px solid #1b5e20;
      border-radius: 6px;
      padding: 4px;
      text-align: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      width: 125px;
    }
    .badge-img {
      width: 100%;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      display: block;
      margin: 0 0 6pt 0 !important;
    }
    .marker-title {
      color: #1b5e20;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14pt !important;
    }

    /* Giao diện bên trong bảng thông tin (Popup) */
    .popup-img { 
      width: 100%; 
      height: 120px; 
      object-fit: cover; 
      border-radius: 4px; 
      margin: 0 0 6pt 0 !important; 
    }
    .btn { 
      display: block; 
      width: 100%; 
      text-align: center; 
      padding: 6pt 0; 
      border-radius: 4px; 
      text-decoration: none; 
      font-weight: bold; 
      margin: 0 0 6pt 0 !important; 
      color: #fff; 
      font-size: 14pt !important; 
    }
  </style>
</head>
<body>

  <div class="top-header">Di sản & Di tích Lịch sử Sơn La (STEM)</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    var map = L.map('map').setView([21.3283, 103.9149], 9);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: 'Bản đồ số Sơn La'
    }).addTo(map);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        var userIcon = L.divIcon({
          className: 'user-gps-icon',
          html: '<div style="background-color: #2980b9; width: 16px; height: 16px; border: 3px solid white; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.6);"></div>',
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });
        L.marker([position.coords.latitude, position.coords.longitude], { icon: userIcon })
         .addTo(map)
         .bindPopup("<p><b>📍 Vị trí hiện tại của bạn</b></p>");
      });
    }

    const locations = [
      { name: "Bãi đá cổ Khe Hổ", lat: 21.9000, lng: 104.2500, tag: "KHẢO CỔ", desc: "Bãi đá khắc cổ tại xã Hang Chú, Bắc Yên.", videoUrl: "https://www.youtube.com/watch?v=SZXUQVDgtOw", img: "daco.jpg" },
      { name: "Kỳ đài Thuận Châu", lat: 21.4800, lng: 103.6800, tag: "LỊCH SỬ", desc: "Di tích lịch sử ghi dấu ấn tại Thuận Châu.", videoUrl: "https://www.youtube.com/watch?v=SZXUQVDgtOw", img: "chau.jpg" },
      { name: "doi", lat: 21.3200, lng: 104.6500, tag: "DANH THẮNG", desc: "Động Sơn Mộc Hương tại Mộc Châu.", videoUrl: "https://www.youtube.com/watch?v=SZXUQVDgtOw", img: "doi.jpg" },
      { name: "Đỉnh Tà Xùa", lat: 21.4300, lng: 104.3800, tag: "TRẢI NGHIỆM", desc: "Thiên đường săn mây tại Bắc Yên.", videoUrl: "https://www.youtube.com/watch?v=SZXUQVDgtOw", img: "xua.jpg" },
      { name: "Văn Bia Quế Lâm Ngự Chế", lat: 21.3270, lng: 103.9080, tag: "VĂN HÓA", desc: "Bài thơ vua Lê Thái Tông trên vách đá TP Sơn La.", videoUrl: "https://www.youtube.com/watch?v=SZXUQVDgtOw", img: "vua.jpg" },
      { name: "Nhà Tù Sơn La", lat: 21.3250, lng: 103.9050, tag: "CÁCH MẠNG", desc: "Di tích quốc gia đặc biệt trên đồi Khau Cả.", videoUrl: "https://www.youtube.com/watch?v=SZXUQVDgtOw", img: "tu.jpg" },
      { name: "Mường Bám", lat: 21.6500, lng: 103.4000, tag: "ĐỊA PHƯƠNG", desc: "Vùng đất và di tích tại xã Mường Bám, Thuận Châu.", videoUrl: "https://www.youtube.com/watch?v=SZXUQVDgtOw", img: "va.jpg" },
      { name: "Đèo Pha Đin", lat: 21.5700, lng: 103.5500, tag: "LỊCH SỬ", desc: "Một trong tứ đại đỉnh đèo hùng vĩ.", videoUrl: "https://www.youtube.com/watch?v=SZXUQVDgtOw", img: "phadin.jpg" },
      { name: "Ngã Ba Cò Nòi", lat: 21.1500, lng: 104.2800, tag: "QUỐC GIA", desc: "Tọa độ lửa giao thông chiến dịch Điện Biên Phủ.", videoUrl: "https://www.youtube.com/watch?v=SZXUQVDgtOw", img: "noi.jpg" },
      { name: "Di tích Việt Nam Lào", lat: 21.1000, lng: 103.8000, tag: "HỮU NGHỊ", desc: "Khu di tích ghi dấu tình hữu nghị đặc biệt.", videoUrl: "https://www.youtube.com/watch?v=SZXUQVDgtOw", img: "Laoviet.jpg" }
    ];

    locations.forEach(loc => {
      var customIcon = L.divIcon({
        className: 'custom-badge-icon',
        html: `
          <div style="text-align: center;">
            <div style="background: #d32f2f; width: 14px; height: 14px; border: 2px solid #fff; border-radius: 50%; margin: 0 auto 4pt auto; box-shadow: 0 0 4px rgba(0,0,0,0.4);"></div>
            <div class="map-badge">
              <img src="${loc.img}" class="badge-img" alt="${loc.name}" onerror="this.src='https://picsum.photos/125/60?random=1'">
              <span class="marker-title">📍 ${loc.name}</span>
            </div>
          </div>`,
        iconSize: [135, 110],
        iconAnchor: [67, 14]
      });

      var marker = L.marker([loc.lat, loc.lng], { icon: customIcon }).addTo(map);
      var mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}`;

      var popupHTML = `
        <div style="width: 240px;">
          <img src="${loc.img}" class="popup-img" alt="${loc.name}" onerror="this.src='https://picsum.photos/240/120?random=1'">
          <p><b>📍 ${loc.tag}</b></p>
          <h3>${loc.name}</h3>
          <p>${loc.desc}</p>
          <a href="${loc.videoUrl}" target="_blank" class="btn" style="background: #c0392b;">▶ Xem Video Thuyết minh</a>
          <a href="ar-ditich.html" class="btn" style="background: #d35400;">📷 Xem 3D / AR & Trắc nghiệm</a>
          <a href="${mapsUrl}" target="_blank" class="btn" style="background: #2980b9;">🚗 Chỉ đường đến đây</a>
        </div>`;
      marker.bindPopup(popupHTML);
    });
  </script>

</body>
</html>
