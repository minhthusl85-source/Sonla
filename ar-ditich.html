<!DOCTYPE html>
<html lang="vi">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta charset="UTF-8">
  <title>Trắc nghiệm QR - Nhà tù Sơn La</title>
  
  <!-- Thư viện đọc mã QR (Html5-Qrcode) -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .container {
      background: #fff; padding: 20px; border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 400px;
      text-align: center; border-top: 6px solid #1b5e20;
    }
    
    .card-title { color: #1b5e20; font-size: 17px; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; }
    
    /* Khu vực máy quét QR */
    #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
    
    .input-box {
      width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box;
    }
    .btn-main {
      width: 100%; background: #1b5e20; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    .btn-main:hover { background: #144517; }

    /* Phần trắc nghiệm ban đầu ẩn đi */
    #step-quiz, #step-info { display: none; }
    .quiz-progress { font-size: 12px; color: #d32f2f; font-weight: bold; margin-bottom: 6px; text-transform: uppercase; }
    .quiz-question { font-size: 14px; color: #222; margin-bottom: 12px; font-weight: bold; text-align: left; line-height: 1.4; }
    .btn-answer {
      display: block; width: 100%; margin: 6px 0; padding: 10px 12px;
      border: 2px solid #1976d2; border-radius: 6px;
      background: #fff; color: #1976d2; font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: left;
    }
    .btn-answer:hover { background: #f0f4f8; }
    
    #top-bar { position: absolute; top: 15px; left: 15px; }
    .btn-back { background: rgba(0,0,0,0.7); color: #fff; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="top-bar">
    <a href="index.html" class="btn-back">⬅ Bản đồ</a>
  </div>

  <div class="container">
    <div class="card-title">🏛️ Trạm: Nhà Tù Sơn La</div>

    <!-- BƯỚC 1: MÁY QUÉT QR -->
    <div id="step-qr">
      <p style="font-size: 13px; color: #555; margin-bottom: 10px;">Vui lòng quét mã QR của trạm để mở bài làm:</p>
      <div id="reader"></div>
    </div>

    <!-- BƯỚC 2: NHẬP HỌ TÊN VÀ LỚP -->
    <div id="step-info">
      <p style="font-size: 13px; color: #555; margin-bottom: 10px;">Quét QR thành công! Em điền thông tin:</p>
      <input type="text" id="hs-name" class="input-box" placeholder="Họ và tên học sinh..." required>
      <input type="text" id="hs-class" class="input-box" placeholder="Lớp (Ví dụ: 10A1)..." required>
      <button class="btn-main" onclick="startQuiz()">Bắt đầu làm bài ➔</button>
    </div>

    <!-- BƯỚC 3: HỆ THỐNG TRẮC NGHIỆM -->
    <div id="step-quiz">
      <div class="quiz-progress" id="q-progress">Câu 1 / 10</div>
      <div class="quiz-question" id="q-text">Đang tải câu hỏi...</div>
      <div id="q-options"></div>
    </div>
  </div>

  <script>
    // 10 câu hỏi trắc nghiệm của cô Thư
    const questions = [
      { q: "Câu 1. Nhà tù Sơn La được thực dân Pháp xây dựng vào năm nào?", options: ["A. 1898", "B. 1905", "C. 1908", "D. 1910"], correct: 2 },
      { q: "Câu 2. Nhà tù Sơn La được xây dựng trên địa điểm nào?", options: ["A. Đồi Khau Cả", "B. Đồi A1", "C. Đồi Cò Nòi", "D. Đồi Nà Sản"], correct: 0 },
      { q: "Câu 3. Ban đầu, Nhà tù Sơn La chủ yếu được sử dụng để giam giữ đối tượng nào?", options: ["A. Tù binh nước ngoài", "B. Tù thường phạm", "C. Tù nhân chiến tranh", "D. Cán bộ cách mạng"], correct: 1 },
      { q: "Câu 4. Nhà tù Sơn La được mở rộng lần đầu vào năm nào, gắn với việc tăng cường giam giữ tù chính trị?", options: ["A. 1925", "B. 1930", "C. 1935", "D. 1940"], correct: 1 },
      { q: "Câu 5. Sau nhiều lần xây dựng và mở rộng, Nhà tù Sơn La có tổng diện tích khoảng bao nhiêu?", options: ["A. 1.217 m²", "B. 1.500 m²", "C. 2.184 m²", "D. 3.500 m²"], correct: 2 },
      { q: "Câu 6. Chi bộ lâm thời Nhà tù Sơn La được thành lập vào thời gian nào?", options: ["A. Tháng 12/1939", "B. Tháng 2/1940", "C. Tháng 5/1940", "D. Tháng 8/1945"], correct: 0 },
      { q: "Câu 7. Ai được cử làm Bí thư Chi bộ lâm thời Nhà tù Sơn La khi mới thành lập?", options: ["A. Tô Hiệu", "B. Lê Duẩn", "C. Trần Huy Liệu", "D. Nguyễn Lương Bằng"], correct: 3 },
      { q: "Câu 8. Đại hội Chi bộ Nhà tù Sơn La tháng 5/1940, ai được bầu làm Bí thư?", options: ["A. Nguyễn Lương Bằng", "B. Tô Hiệu", "C. Trần Đăng Ninh", "D. Văn Tiến Dũng"], correct: 1 },
      { q: "Câu 9. Vì sao Nhà tù Sơn La còn được ví như một “trường học cách mạng”?", options: ["A. Nơi tổ chức lớp học văn hóa.", "B. Chiến sĩ cách mạng học tập, rèn luyện, tuyên truyền và đào tạo cán bộ ngay trong tù.", "C. Pháp xây trường học cạnh nhà tù.", "D. Nơi đào tạo binh lính Pháp."], correct: 1 },
      { q: "Câu 10. Nhà tù Sơn La từng diễn ra bao nhiêu cuộc vượt ngục vào các năm 1941 và 1943?", options: ["A. 1 cuộc", "B. 2 cuộc", "C. 3 cuộc", "D. 4 cuộc"], correct: 1 }
    ];

    let studentName = "";
    let studentClass = "";
    let currentQIndex = 0;
    let totalScore = 0;

    // Khởi động Camera quét mã QR ngay khi mở trang
    function onScanSuccess(decodedText, decodedResult) {
      // Khi quét trúng mã QR hợp lệ (có thể là link hoặc mã bất kỳ của trạm)
      html5QrCode.stop().then((ignore) => {
        document.getElementById("step-qr").style.display = "none";
        document.getElementById("step-info").style.display = "block";
      }).catch((err) => {
        console.error("Lỗi dừng camera quét QR", err);
      });
    }

    let html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" }, 
      { fps: 10, qrbox: { width: 220, height: 220 } },
      onScanSuccess
    ).catch(err => {
      // Nếu không mở được camera, hiển thị thông báo để học sinh bấm chuyển bước thủ công hoặc kiểm tra quyền
      document.getElementById("step-qr").innerHTML = '<p style="color:red; font-size:13px;">Không mở được camera. <br><button class="btn-main" onclick="skipQR()">Bấm vào đây để làm bài trực tiếp</button></p>';
    });

    // Nút dự phòng nếu máy học sinh lỗi camera
    function skipQR() {
      document.getElementById("step-qr").style.display = "none";
      document.getElementById("step-info").style.display = "block";
    }

    function startQuiz() {
      studentName = document.getElementById("hs-name").value.trim();
      studentClass = document.getElementById("hs-class").value.trim();

      if(studentName === "" || studentClass === "") {
        alert("Em vui lòng điền đầy đủ Họ tên và Lớp nhé!");
        return;
      }

      document.getElementById("step-info").style.display = "none";
      document.getElementById("step-quiz").style.display = "block";
      loadQuestion();
    }

    function loadQuestion() {
      let q = questions[currentQIndex];
      document.getElementById("q-progress").innerText = `Câu ${currentQIndex + 1} / ${questions.length}`;
      document.getElementById("q-text").innerText = q.q;

      let optionsHTML = "";
      q.options.forEach((opt, idx) => {
        optionsHTML += `<button class="btn-answer" onclick="checkAnswer(${idx})">${opt}</button>`;
      });
      document.getElementById("q-options").innerHTML = optionsHTML;
    }

    function checkAnswer(selectedIdx) {
      let q = questions[currentQIndex];
      if(selectedIdx === q.correct) {
        totalScore += 10; // Mỗi câu đúng 10 điểm (Tổng 100 điểm)
      }

      currentQIndex++;
      if(currentQIndex < questions.length) {
        loadQuestion();
      } else {
        alert(`🎉 Hoàn thành bài làm!\nHọc sinh: ${studentName} - Lớp ${studentClass}\nTổng điểm: ${totalScore} / 100\n\nHệ thống sẽ chuyển sang Google Form để hoàn tất.`);
        
        // Link Google Form của cô
        const formURL = "https://forms.gle/MG5Hztpqj7Z3YXx59";
        window.location.href = formURL;
      }
    }
  </script>
</body>
</html>
